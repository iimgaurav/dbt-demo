name: dbt CI/CD

on:
  push:
    branches:
      - master
  pull_request:
    branches:
      - master

env:
  DBT_PROFILES_DIR: .
  DBT_PROJECT_DIR: .

jobs:
  ci-checks:
    name: CI - dbt tests & compile
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    env:
      DATABRICKS_HOST: ${{ secrets.DATABRICKS_HOST_NAME }}
      DATABRICKS_HTTP_PATH: ${{ secrets.DATABRICKS_HTTP_PATH }}
      DATABRICKS_TOKEN: ${{ secrets.DATABRICKS_TOKEN }}
      DATABRICKS_CATALOG: ${{ secrets.DATABRICKS_CATALOG }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dbt
        run: pip install dbt-databricks

      - name: Generate profiles.yml
        run: |
          python -c "
          import yaml, os
          profile = {
              'dbt_proj_to': {
                  'target': 'dev',
                  'outputs': {
                      'dev': {
                          'type': 'databricks',
                          'host': os.environ['DATABRICKS_HOST'],
                          'http_path': os.environ['DATABRICKS_HTTP_PATH'],
                          'token': os.environ['DATABRICKS_TOKEN'],
                          'catalog': os.environ['DATABRICKS_CATALOG'],
                          'schema': 'default',
                          'threads': 4
                      }
                  }
              }
          }
          with open('profiles.yml', 'w') as f:
              yaml.dump(profile, f, default_flow_style=False)
          "

      - name: Debug profile
        run: |
          echo "Generated profiles.yml:"
          cat profiles.yml
          echo "Host length: ${#DATABRICKS_HOST}"
          echo "Token length: ${#DATABRICKS_TOKEN}"

      - name: Install dependencies
        run: dbt deps

      - name: Check for broken models
        run: dbt compile

      - name: Run dbt tests
        run: dbt test

  cd-build:
    name: CD - dbt build (production)
    if: github.event_name == 'push' && github.ref == 'refs/heads/master'
    runs-on: ubuntu-latest
    env:
      DATABRICKS_HOST: ${{ secrets.DATABRICKS_HOST_NAME }}
      DATABRICKS_HTTP_PATH: ${{ secrets.DATABRICKS_HTTP_PATH }}
      DATABRICKS_TOKEN: ${{ secrets.DATABRICKS_TOKEN }}
      DATABRICKS_CATALOG: ${{ secrets.DATABRICKS_CATALOG }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dbt
        run: pip install dbt-databricks

      - name: Generate profiles.yml
        run: |
          python -c "
          import yaml, os
          profile = {
              'dbt_proj_to': {
                  'target': 'dev',
                  'outputs': {
                      'dev': {
                          'type': 'databricks',
                          'host': os.environ['DATABRICKS_HOST'],
                          'http_path': os.environ['DATABRICKS_HTTP_PATH'],
                          'token': os.environ['DATABRICKS_TOKEN'],
                          'catalog': os.environ['DATABRICKS_CATALOG'],
                          'schema': 'default',
                          'threads': 4
                      }
                  }
              }
          }
          with open('profiles.yml', 'w') as f:
              yaml.dump(profile, f, default_flow_style=False)
          "

      - name: Debug profile
        run: |
          echo "Generated profiles.yml:"
          cat profiles.yml
          echo "Host length: ${#DATABRICKS_HOST}"
          echo "Token length: ${#DATABRICKS_TOKEN}"

      - name: Install dependencies
        run: dbt deps

      - name: Check for broken models
        run: dbt compile

      - name: Run dbt build (tests + models + seeds + snapshots)
        run: dbt build

      - name: Run source freshness
        run: dbt source freshness
