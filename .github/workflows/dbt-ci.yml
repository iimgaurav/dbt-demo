name: dbt CI/CD

on:
  push:
    branches:
      - master
    paths:
      - "models/**"
      - "macros/**"
      - "seeds/**"
      - "snapshots/**"
      - "dbt_project.yml"
      - "packages.yml"
      - "generate_profiles.py"
      - ".github/workflows/dbt-ci.yml"
  pull_request:
    branches:
      - master
    paths:
      - "models/**"
      - "macros/**"
      - "seeds/**"
      - "snapshots/**"
      - "dbt_project.yml"
      - "packages.yml"
      - "generate_profiles.py"
      - ".github/workflows/dbt-ci.yml"
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  DBT_PROFILES_DIR: ${{ github.workspace }}
  DBT_PROJECT_DIR: ${{ github.workspace }}
  DBT_VERSION: "1.11.8"

permissions:
  contents: read

jobs:
  lint:
    name: Lint & Validate
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate YAML syntax
        run: |
          python -c "
          import yaml, sys, glob
          errors = []
          for f in glob.glob('**/*.yml', recursive=True):
              try:
                  with open(f) as fh:
                      yaml.safe_load(fh)
              except Exception as e:
                  errors.append(f'{f}: {e}')
          if errors:
              print('YAML errors found:')
              for e in errors:
                  print(f'  - {e}')
              sys.exit(1)
          print('All YAML files valid')
          "

      - name: Check for secrets in code
        run: |
          if grep -rn "password\|token\|secret\|api_key" models/ macros/ --include="*.sql" 2>/dev/null; then
            echo "WARNING: Potential secrets found in code"
            exit 1
          fi
          echo "No secrets found in code"

  ci-checks:
    name: CI - dbt compile & test
    needs: lint
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Cache dbt packages
        uses: actions/cache@v4
        with:
          path: ~/.dbt/packages
          key: ${{ runner.os }}-dbt-packages-${{ hashFiles('packages.yml') }}
          restore-keys: |
            ${{ runner.os }}-dbt-packages-

      - name: Install dbt
        run: |
          pip install dbt-databricks~=${{ env.DBT_VERSION }}
          dbt --version

      - name: Generate profiles.yml
        run: python generate_profiles.py
        env:
          DBT_DATABRICKS_HOST_NAME: ${{ secrets.DBT_DATABRICKS_HOST_NAME }}
          DBT_DATABRICKS_HTTP_PATH: ${{ secrets.DBT_DATABRICKS_HTTP_PATH }}
          DBT_DATABRICKS_TOKEN: ${{ secrets.DBT_DATABRICKS_TOKEN }}
          DBT_DATABRICKS_CATALOG: ${{ secrets.DBT_DATABRICKS_CATALOG }}

      - name: Install dependencies
        run: dbt deps

      - name: Compile models
        run: dbt compile

      - name: Run dbt tests
        run: dbt test

      - name: Upload compiled artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ci-compiled-models
          path: target/
          retention-days: 3

  cd-build:
    name: CD - dbt build
    needs: lint
    if: github.event_name == 'push' && github.ref == 'refs/heads/master'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment:
      name: production

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Cache dbt packages
        uses: actions/cache@v4
        with:
          path: ~/.dbt/packages
          key: ${{ runner.os }}-dbt-packages-${{ hashFiles('packages.yml') }}
          restore-keys: |
            ${{ runner.os }}-dbt-packages-

      - name: Install dbt
        run: |
          pip install dbt-databricks~=${{ env.DBT_VERSION }}
          dbt --version

      - name: Generate profiles.yml
        run: python generate_profiles.py
        env:
          DBT_DATABRICKS_HOST_NAME: ${{ secrets.DBT_DATABRICKS_HOST_NAME }}
          DBT_DATABRICKS_HTTP_PATH: ${{ secrets.DBT_DATABRICKS_HTTP_PATH }}
          DBT_DATABRICKS_TOKEN: ${{ secrets.DBT_DATABRICKS_TOKEN }}
          DBT_DATABRICKS_CATALOG: ${{ secrets.DBT_DATABRICKS_CATALOG }}

      - name: Install dependencies
        run: dbt deps

      - name: Compile models (pre-build check)
        run: dbt compile

      - name: Run dbt build
        id: build
        run: |
          dbt build --full-refresh 2>&1 | tee build.log
          echo "build_status=success" >> $GITHUB_OUTPUT

      - name: Run source freshness
        if: steps.build.outputs.build_status == 'success'
        run: dbt source freshness

      - name: Upload build logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cd-build-logs
          path: |
            build.log
            target/run_results.json
            target/manifest.json
          retention-days: 7

      - name: Notify on failure
        if: failure()
        run: |
          echo "::error::dbt build failed on master branch"
          echo "Check logs at: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"

  validate-secrets:
    name: Validate Secrets
    runs-on: ubuntu-latest
    if: github.event_name == 'workflow_dispatch'
    timeout-minutes: 5

    steps:
      - name: Validate Databricks secrets
        run: |
          echo "Validating secrets..."
          [ -z "$DBT_DATABRICKS_HOST_NAME" ] && echo "ERROR: DBT_DATABRICKS_HOST_NAME not set" && exit 1
          [ -z "$DBT_DATABRICKS_HTTP_PATH" ] && echo "ERROR: DBT_DATABRICKS_HTTP_PATH not set" && exit 1
          [ -z "$DBT_DATABRICKS_TOKEN" ] && echo "ERROR: DBT_DATABRICKS_TOKEN not set" && exit 1
          [ -z "$DBT_DATABRICKS_CATALOG" ] && echo "ERROR: DBT_DATABRICKS_CATALOG not set" && exit 1
          echo "All secrets validated successfully"
          echo "Host: ${DBT_DATABRICKS_HOST_NAME:0:10}..."
          echo "Catalog: $DBT_DATABRICKS_CATALOG"
        env:
          DBT_DATABRICKS_HOST_NAME: ${{ secrets.DBT_DATABRICKS_HOST_NAME }}
          DBT_DATABRICKS_HTTP_PATH: ${{ secrets.DBT_DATABRICKS_HTTP_PATH }}
          DBT_DATABRICKS_TOKEN: ${{ secrets.DBT_DATABRICKS_TOKEN }}
          DBT_DATABRICKS_CATALOG: ${{ secrets.DBT_DATABRICKS_CATALOG }}
