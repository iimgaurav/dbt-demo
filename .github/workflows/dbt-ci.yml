name: dbt CI/CD

on:
  push:
    branches:
      - master
  pull_request:
    branches:
      - master

env:
  DBT_PROFILES_DIR: ${{ github.workspace }}
  DBT_PROJECT_DIR: ${{ github.workspace }}

jobs:
  ci-checks:
    name: CI - dbt tests & compile
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dbt
        run: pip install dbt-databricks

      - name: Generate profiles.yml
        run: python generate_profiles.py
        env:
          DBT_DATABRICKS_HOST_NAME: ${{ secrets.DBT_DATABRICKS_HOST_NAME }}
          DBT_DATABRICKS_HTTP_PATH: ${{ secrets.DBT_DATABRICKS_HTTP_PATH }}
          DBT_DATABRICKS_TOKEN: ${{ secrets.DBT_DATABRICKS_TOKEN }}
          DBT_DATABRICKS_CATALOG: ${{ secrets.DBT_DATABRICKS_CATALOG }}

      - name: Debug profile
        run: |
          echo "DBT_PROFILES_DIR=$DBT_PROFILES_DIR"
          ls -la "$DBT_PROFILES_DIR/profiles.yml"
          cat "$DBT_PROFILES_DIR/profiles.yml"

      - name: Install dependencies
        run: dbt deps

      - name: Check for broken models
        run: dbt compile

      - name: Run dbt tests
        run: dbt test

  cd-build:
    name: CD - dbt build (production)
    if: github.event_name == 'push' && github.ref == 'refs/heads/master'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dbt
        run: pip install dbt-databricks

      - name: Generate profiles.yml
        run: python generate_profiles.py
        env:
          DBT_DATABRICKS_HOST_NAME: ${{ secrets.DBT_DATABRICKS_HOST_NAME }}
          DBT_DATABRICKS_HTTP_PATH: ${{ secrets.DBT_DATABRICKS_HTTP_PATH }}
          DBT_DATABRICKS_TOKEN: ${{ secrets.DBT_DATABRICKS_TOKEN }}
          DBT_DATABRICKS_CATALOG: ${{ secrets.DBT_DATABRICKS_CATALOG }}

      - name: Debug profile
        run: |
          echo "DBT_PROFILES_DIR=$DBT_PROFILES_DIR"
          ls -la "$DBT_PROFILES_DIR/profiles.yml"
          cat "$DBT_PROFILES_DIR/profiles.yml"

      - name: Install dependencies
        run: dbt deps

      - name: Check for broken models
        run: dbt compile

      - name: Run dbt build (tests + models + seeds + snapshots)
        run: dbt build

      - name: Run source freshness
        run: dbt source freshness
