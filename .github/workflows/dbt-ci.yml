name: dbt CI/CD

on:
  push:
    branches:
      - master
  pull_request:
    branches:
      - master

env:
  DBT_PROFILES_DIR: .
  DBT_PROJECT_DIR: .

jobs:
  ci-checks:
    name: CI - dbt tests & compile
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dbt
        run: pip install dbt-databricks

      - name: Set Databricks env vars
        run: |
          echo "DBT_DATABRICKS_HOST_NAME=$(echo "$RAW_HOST" | tr -d '\r\n')" >> "$GITHUB_ENV"
          echo "DBT_DATABRICKS_HTTP_PATH=$(echo "$RAW_PATH" | tr -d '\r\n')" >> "$GITHUB_ENV"
          echo "DBT_DATABRICKS_TOKEN=$(echo "$RAW_TOKEN" | tr -d '\r\n')" >> "$GITHUB_ENV"
          echo "DBT_DATABRICKS_CATALOG=$(echo "$RAW_CATALOG" | tr -d '\r\n')" >> "$GITHUB_ENV"
        env:
          RAW_HOST: ${{ secrets.DBT_DATABRICKS_HOST_NAME }}
          RAW_PATH: ${{ secrets.DBT_DATABRICKS_HTTP_PATH }}
          RAW_TOKEN: ${{ secrets.DBT_DATABRICKS_TOKEN }}
          RAW_CATALOG: ${{ secrets.DBT_DATABRICKS_CATALOG }}

      - name: Install dependencies
        run: dbt deps

      - name: Check for broken models
        run: dbt compile

      - name: Run dbt tests
        run: dbt test

  cd-build:
    name: CD - dbt build (production)
    if: github.event_name == 'push' && github.ref == 'refs/heads/master'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dbt
        run: pip install dbt-databricks

      - name: Set Databricks env vars
        run: |
          echo "DBT_DATABRICKS_HOST_NAME=$(echo "$RAW_HOST" | tr -d '\r\n')" >> "$GITHUB_ENV"
          echo "DBT_DATABRICKS_HTTP_PATH=$(echo "$RAW_PATH" | tr -d '\r\n')" >> "$GITHUB_ENV"
          echo "DBT_DATABRICKS_TOKEN=$(echo "$RAW_TOKEN" | tr -d '\r\n')" >> "$GITHUB_ENV"
          echo "DBT_DATABRICKS_CATALOG=$(echo "$RAW_CATALOG" | tr -d '\r\n')" >> "$GITHUB_ENV"
        env:
          RAW_HOST: ${{ secrets.DBT_DATABRICKS_HOST_NAME }}
          RAW_PATH: ${{ secrets.DBT_DATABRICKS_HTTP_PATH }}
          RAW_TOKEN: ${{ secrets.DBT_DATABRICKS_TOKEN }}
          RAW_CATALOG: ${{ secrets.DBT_DATABRICKS_CATALOG }}

      - name: Install dependencies
        run: dbt deps

      - name: Check for broken models
        run: dbt compile

      - name: Run dbt build (tests + models + seeds + snapshots)
        run: dbt build

      - name: Run source freshness
        run: dbt source freshness
