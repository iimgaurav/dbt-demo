name: dbt CI/CD

on:
  push:
    branches:
      - master
  pull_request:
    branches:
      - master

env:
  DBT_PROFILES_DIR: .
  DBT_PROJECT_DIR: .

jobs:
  ci-checks:
    name: CI - dbt tests & compile
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dbt
        run: pip install dbt-databricks

      - name: Generate profiles.yml
        run: |
          cat > profiles.yml << EOF
          dbt_proj_to:
            target: dev
            outputs:
              dev:
                type: databricks
                host: ${{ secrets.DATABRICKS_HOST }}
                http_path: ${{ secrets.DATABRICKS_HTTP_PATH }}
                token: ${{ secrets.DATABRICKS_TOKEN }}
                catalog: ${{ secrets.DATABRICKS_CATALOG }}
                schema: default
                threads: 4
          EOF

      - name: Install dependencies
        run: dbt deps

      - name: Check for broken models
        run: dbt compile

      - name: Run dbt tests
        run: dbt test

  cd-build:
    name: CD - dbt build (production)
    if: github.event_name == 'push' && github.ref == 'refs/heads/master'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dbt
        run: pip install dbt-databricks

      - name: Generate profiles.yml
        run: |
          cat > profiles.yml << EOF
          dbt_proj_to:
            target: dev
            outputs:
              dev:
                type: databricks
                host: ${{ secrets.DATABRICKS_HOST }}
                http_path: ${{ secrets.DATABRICKS_HTTP_PATH }}
                token: ${{ secrets.DATABRICKS_TOKEN }}
                catalog: ${{ secrets.DATABRICKS_CATALOG }}
                schema: default
                threads: 4
          EOF

      - name: Install dependencies
        run: dbt deps

      - name: Check for broken models
        run: dbt compile

      - name: Run dbt build (tests + models + seeds + snapshots)
        run: dbt build

      - name: Run source freshness
        run: dbt source freshness
