version: 2

models:
  - name: bronze_customer
    description: "Raw customer dimension selected from the source system."
    columns:
      - name: customer_sk
        description: "Surrogate key for the customer."
        tests: [unique, not_null]
      - name: customer_code
        description: "Business customer identifier."
        tests: [not_null]
      - name: first_name
        description: "Customer first name."
      - name: last_name
        description: "Customer last name."
      - name: gender
        description: "Customer gender."
      - name: email
        description: "Customer email address."
        tests: [not_null]
      - name: phone
        description: "Customer phone number."
      - name: loyalty_tier
        description: "Customer loyalty program tier."
      - name: signup_date
        description: "Date customer signed up."
      - name: record_source
        description: "Source system identifier."
      - name: load_date
        description: "Timestamp when record was loaded."

  - name: bronze_product
    description: "Raw product dimension selected from the source system."
    columns:
      - name: product_sk
        description: "Surrogate key for the product."
        tests: [unique, not_null]
      - name: product_code
        description: "Business product identifier."
        tests: [not_null]
      - name: product_name
        description: "Name of the product."
      - name: department
        description: "Product department."
      - name: category
        description: "Product category."
      - name: supplier_sk
        description: "Surrogate key for the supplier."
      - name: list_price
        description: "List price of the product."
      - name: uom
        description: "Unit of measure."

  - name: bronze_store
    description: "Raw store dimension selected from the source system."
    columns:
      - name: store_sk
        description: "Surrogate key for the store."
        tests: [unique, not_null]
      - name: store_code
        description: "Business store identifier."
        tests: [not_null]
      - name: store_name
        description: "Name of the store."
      - name: city
        description: "City where store is located."
      - name: state_province
        description: "State or province."
      - name: region
        description: "Geographic region."
      - name: country
        description: "Country where store is located."
      - name: open_date
        description: "Date store was opened."
      - name: sq_ft
        description: "Store size in square feet."

  - name: bronze_date
    description: "Raw calendar date dimension selected from the source system."
    columns:
      - name: date_sk
        description: "Surrogate key for the calendar date."
        tests: [unique, not_null]
      - name: date
        description: "Calendar date value."
        tests: [unique, not_null]
      - name: year
        description: "Calendar year."
      - name: month
        description: "Calendar month number."
      - name: month_name
        description: "Name of the month."
      - name: day_of_week
        description: "Day of the week."
      - name: quarter
        description: "Calendar quarter."
      - name: is_weekend
        description: "Flag indicating if date is a weekend."

  - name: bronze_sales
    description: "Raw sales fact selected from the source system."
    columns:
      - name: sales_id
        description: "Unique identifier for a sales transaction."
        tests: [unique, not_null]
      - name: date_sk
        description: "Foreign key to date dimension."
        tests: [not_null]
      - name: store_sk
        description: "Foreign key to store dimension."
        tests: [not_null]
      - name: product_sk
        description: "Foreign key to product dimension."
        tests: [not_null]
      - name: customer_sk
        description: "Foreign key to customer dimension."
        tests: [not_null]
      - name: promotion_sk
        description: "Foreign key to promotion dimension."
      - name: quantity
        description: "Number of units sold."
      - name: unit_price
        description: "Price per unit."
      - name: gross_amount
        description: "Gross sales amount before discount."
      - name: discount_amount
        description: "Discount amount applied."
      - name: net_amount
        description: "Sales amount after discount."
        tests: [not_null]
      - name: payment_method
        description: "Payment method used."

  - name: bronze_returns
    description: "Raw returns fact selected from the source system. Some sales_id values may be NULL in the source - this is expected at the Bronze layer. Silver layer filters these out."
    columns:
      - name: sales_id
        description: "Foreign key to the original sales transaction."
      - name: date_sk
        description: "Foreign key to date dimension."
      - name: store_sk
        description: "Foreign key to store dimension."
      - name: product_sk
        description: "Foreign key to product dimension."
      - name: customer_sk
        description: "Foreign key to customer dimension."
      - name: promotion_sk
        description: "Foreign key to promotion dimension."
      - name: returned_qty
        description: "Number of units returned. May be NULL at Bronze layer."
      - name: return_reason
        description: "Reason for the return."
      - name: refund_amount
        description: "Amount refunded to customer."
