version: 2

models:
  - name: silver_customer
    description: "Cleaned customer dimension with tenure classification."
    columns:
      - name: customer_sk
        tests: [unique, not_null]
      - name: customer_tenure
        description: "Customer segment based on signup age."

  - name: silver_product
    description: "Cleaned product dimension."
    columns:
      - name: product_sk
        tests: [unique, not_null]

  - name: silver_store
    description: "Cleaned store dimension with age classification."
    columns:
      - name: store_sk
        tests: [unique, not_null]
      - name: store_age_group
        description: "Store segment based on open date."

  - name: silver_date
    description: "Cleaned date dimension with ingestion metadata."
    columns:
      - name: date_sk
        tests: [unique, not_null]
      - name: date
        tests: [unique, not_null]

  - name: silver_sales
    description: "Cleaned sales transactions with effective pricing."
    columns:
      - name: sales_id
        tests: [unique, not_null]
      - name: net_amount
        tests: [not_null]
      - name: effective_price
        description: "Net amount divided by quantity with divide-by-zero protection."

  - name: silver_returns
    description: "Cleaned returns data."
    columns:
      - name: sales_id
        tests: [not_null]
      - name: returned_qty
        tests: [not_null]
