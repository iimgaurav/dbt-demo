version: 2

models:
  - name: gold_daily_sales
    description: "Daily sales aggregation for trend analysis. Aggregates sales by date with revenue, customer, and transaction metrics."
    columns:
      - name: date
        description: "Calendar date."
        tests: [unique, not_null]
      - name: total_transactions
        description: "Total number of sales transactions."
      - name: unique_customers
        description: "Number of distinct customers."
      - name: total_units_sold
        description: "Total units sold."
      - name: total_revenue
        description: "Total net revenue."
        tests: [not_null]
      - name: avg_transaction_value
        description: "Average revenue per transaction."
      - name: avg_unit_price_realized
        description: "Average effective unit price."
      - name: computed_at
        description: "Timestamp when record was computed."

  - name: gold_monthly_summary
    description: "Monthly business summary with revenue, customers, products, stores, refunds, and return rate."
    columns:
      - name: year
        description: "Calendar year."
        tests: [not_null]
      - name: month
        description: "Calendar month number."
        tests: [not_null]
      - name: month_name
        description: "Name of the month."
      - name: quarter
        description: "Calendar quarter."
      - name: total_transactions
        description: "Total number of sales transactions."
      - name: active_customers
        description: "Number of distinct customers who made purchases."
      - name: products_sold
        description: "Number of distinct products sold."
      - name: active_stores
        description: "Number of stores with sales."
      - name: total_units_sold
        description: "Total units sold."
      - name: total_revenue
        description: "Total net revenue."
      - name: avg_transaction_value
        description: "Average revenue per transaction."
      - name: total_returns
        description: "Total number of return transactions."
      - name: total_refunds
        description: "Total refund amount."
      - name: return_rate_pct
        description: "Return rate as a percentage of total transactions."
      - name: computed_at
        description: "Timestamp when record was computed."

  - name: gold_customer_metrics
    description: "Customer-level KPIs for segmentation and lifetime value analysis."
    columns:
      - name: customer_sk
        description: "Surrogate key for the customer."
        tests: [unique, not_null]
      - name: customer_code
        description: "Business customer identifier."
      - name: first_name
        description: "Customer first name."
      - name: last_name
        description: "Customer last name."
      - name: loyalty_tier
        description: "Customer loyalty program tier."
      - name: total_orders
        description: "Total number of orders placed."
      - name: total_units_purchased
        description: "Total units purchased."
      - name: total_spent
        description: "Total amount spent."
      - name: avg_order_value
        description: "Average order value."
      - name: revenue_per_order
        description: "Average revenue per order."
      - name: computed_at
        description: "Timestamp when record was computed."

  - name: gold_customer_ltv
    description: "Customer lifetime value calculated from cleaned sales transactions. Uses incremental materialization."
    columns:
      - name: customer_sk
        description: "Surrogate key for the customer."
        tests: [unique, not_null]
      - name: total_orders
        description: "Total number of orders placed."
      - name: total_units_purchased
        description: "Total units purchased."
      - name: lifetime_value
        description: "Total lifetime value (net revenue) of the customer."
        tests: [not_null]
      - name: first_purchase_date
        description: "Date of first purchase."
      - name: last_purchase_date
        description: "Date of most recent purchase."
      - name: computed_at
        description: "Timestamp when record was computed."

  - name: gold_product_performance
    description: "Product-level KPIs including revenue, units sold, refunds, and return rate."
    columns:
      - name: product_sk
        description: "Surrogate key for the product."
        tests: [unique, not_null]
      - name: product_name
        description: "Name of the product."
      - name: category
        description: "Product category."
      - name: department
        description: "Product department."
      - name: total_transactions
        description: "Total number of transactions."
      - name: total_units_sold
        description: "Total units sold."
      - name: total_revenue
        description: "Total net revenue."
      - name: avg_selling_price
        description: "Average selling price."
      - name: total_returns
        description: "Total number of returns."
      - name: total_returned_units
        description: "Total units returned."
      - name: total_refunds
        description: "Total refund amount."
      - name: return_rate_pct
        description: "Return rate as a percentage."
      - name: computed_at
        description: "Timestamp when record was computed."

  - name: gold_store_performance
    description: "Store-level KPIs including revenue, transactions, refunds, and return rate."
    columns:
      - name: store_sk
        description: "Surrogate key for the store."
        tests: [unique, not_null]
      - name: store_name
        description: "Name of the store."
      - name: city
        description: "City where store is located."
      - name: region
        description: "Geographic region."
      - name: country
        description: "Country where store is located."
      - name: total_transactions
        description: "Total number of transactions."
      - name: unique_customers
        description: "Number of distinct customers."
      - name: total_units_sold
        description: "Total units sold."
      - name: total_revenue
        description: "Total net revenue."
      - name: avg_transaction_value
        description: "Average revenue per transaction."
      - name: total_returns
        description: "Total number of returns."
      - name: total_refunds
        description: "Total refund amount."
      - name: return_rate_pct
        description: "Return rate as a percentage."
      - name: computed_at
        description: "Timestamp when record was computed."
