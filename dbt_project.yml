
name: 'dbt_proj_to'
version: '1.0.0'
config-version: 2

profile: 'dbt_proj_to'

model-paths: ["models"]
analysis-paths: ["analyses"]
test-paths: ["tests"]
seed-paths: ["seeds"]
macro-paths: ["macros"]
snapshot-paths: ["snapshots"]

clean-targets:         # directories to be removed by `dbt clean`
  - "target"
  - "dbt_packages"

models:
  dbt_proj_to:
    +persist_docs:
      relation: true
      columns: true
    Bronze:
      +materialized: view
      +schema: bronze
      +tags: ["bronze", "staging"]
    Silver:
      +materialized: table
      +schema: silver
      +tags: ["silver", "cleaned"]
    Gold:
      +materialized: table
      +schema: gold
      +tags: ["gold", "mart"]
